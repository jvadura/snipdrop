[package]
name = "snipdrop"
version = "0.1.0"
edition = "2024"
description = "Snip a screen region and make it pasteable into terminal coding agents (Claude Code and friends) on Windows"
license = "MIT"
repository = "https://github.com/jvadura/snipdrop"
readme = "README.md"
keywords = ["screenshot", "clipboard", "windows", "tray", "claude"]
categories = ["command-line-utilities"]

[dependencies]
png = "0.18.1"

[dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
